<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emiliano — Editor de video y motion graphics</title>
<meta name="theme-color" content="#101114">
<meta name="description" content="Portafolio de Emiliano, editor de video y motion graphics en CapCut para Reels, TikTok y YouTube Shorts.">
<style>
:root{color-scheme:dark;--bg:#101114;--sf:#18191E;--fg:#E9E9EE;--mute:#A3A3AD;--line:#2A2B33;--acc:#FF5A5F;--k:#101114;--silver:#A9A9B6;--bg-rgb:16,17,20;--acc-rgb:255,90,95;--acc-hi:#FF8B8F;--acc-lo:#E8484F;--r:20px;--tr:-1px;--half:580px;
  --f:"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 17px/1.55 var(--f);letter-spacing:var(--tr);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
::selection{background:var(--acc);color:var(--k)}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
h1,h2,h3{font-weight:700;line-height:1}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px;position:relative;z-index:1}
#bar{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--acc);transform:scaleX(0);transform-origin:0 50%;z-index:60}
#glow{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:radial-gradient(circle,rgba(var(--acc-rgb),.13),transparent 65%);pointer-events:none;z-index:0;will-change:transform}

nav{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);background:rgba(var(--bg-rgb),.78);border-bottom:1px solid var(--line)}
nav .in{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-weight:700;font-size:21px;text-decoration:none;display:flex;align-items:center;gap:9px}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px var(--acc)}
nav ul{display:flex;gap:26px;list-style:none;padding:0;font-size:15px}
nav ul a{text-decoration:none;color:var(--mute);transition:color .2s}
nav ul a:hover{color:var(--acc)}
.btn{--mx:0px;--my:0px;display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:99px;font:600 16px var(--f);letter-spacing:var(--tr);text-decoration:none;border:2px solid var(--fg);color:var(--fg);background:transparent;cursor:pointer;transform:translate(var(--mx),var(--my));transition:background .2s,color .2s,box-shadow .25s,transform .15s}
.btn.fill{background:var(--acc);border-color:var(--acc);color:var(--k);box-shadow:0 5px 0 var(--acc-lo),0 14px 26px rgba(var(--acc-rgb),.16)}
.btn:hover{background:var(--fg);color:var(--k);box-shadow:0 0 0 5px rgba(244,244,240,.12)}
.btn.fill:hover{background:var(--acc);box-shadow:0 5px 0 var(--acc-lo),0 18px 38px rgba(var(--acc-rgb),.3)}
.btn:active{transform:translate(var(--mx),calc(var(--my) + 4px))}
.btn.fill:active{box-shadow:0 1px 0 var(--acc-lo)}
nav .btn{padding:9px 20px;font-size:15px}

.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding:48px 0 76px}
.chip{display:inline-flex;gap:9px;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:99px;padding:7px 15px;font-size:14px}
.chip b{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:ping 1.6s infinite}
@keyframes ping{to{box-shadow:0 0 0 10px rgba(34,197,94,0)}}
h1{font-size:clamp(44px,7.2vw,96px);margin:22px 0}
.rot{display:block;color:var(--acc);min-height:2.1em}
.rot::after{content:"";display:inline-block;width:.07em;height:.85em;margin-left:.06em;background:var(--acc);vertical-align:-.05em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sub{color:var(--mute);font-size:19px;max-width:46ch}
.acts{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}

.ph{position:relative;aspect-ratio:1/1;width:100%;max-width:440px;margin-left:auto;perspective:900px}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .15s ease-out}
.blob{position:absolute;inset:4%;background:var(--acc);border-radius:48% 52% 44% 56%/52% 46% 54% 48%;animation:morph 9s ease-in-out infinite alternate;box-shadow:0 0 120px rgba(var(--acc-rgb),.28)}
@keyframes morph{to{border-radius:56% 44% 54% 46%/44% 56% 46% 54%;transform:rotate(4deg)}}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:var(--r);filter:drop-shadow(0 22px 28px rgba(0,0,0,.45));transform:translateZ(40px)}
.none{position:absolute;inset:14% 10% 6%;display:grid;place-content:center;text-align:center;gap:6px;border:2px dashed var(--k);border-radius:var(--r);color:var(--k);padding:20px;font-size:15px}
.none b{font-size:24px}
.tag{position:absolute;background:var(--sf);border:1px solid var(--acc);color:var(--fg);border-radius:99px;padding:8px 16px;font-weight:600;font-size:14px;box-shadow:0 0 22px rgba(var(--acc-rgb),.20);animation:fl 5s ease-in-out infinite alternate;white-space:nowrap;z-index:2}
.t1{top:9%;left:-7%}.t2{top:46%;right:-7%;animation-delay:-2s}.t3{bottom:9%;left:0;animation-delay:-3.5s}
@keyframes fl{to{transform:translateY(-10px) rotate(-2deg)}}

/* Iconos en botones */
.btn svg{width:22px;height:22px;fill:currentColor;flex:0 0 auto}

/* Brillo en títulos y subtítulos */
h1,h2,h3,.sub,.lead,.stat b,.rot{--b1:var(--fg);--b2:var(--silver);--hl:rgba(255,255,255,.88);
  background-image:linear-gradient(105deg,transparent 40%,var(--hl) 50%,transparent 60%),linear-gradient(180deg,var(--b1),var(--b2));
  background-size:300% 100%,100% 100%;background-repeat:no-repeat;background-position:100% 0,0 0;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  animation:sh 5s linear infinite}
@keyframes sh{to{background-position:0% 0,0 0}}
h2{animation-delay:-1.3s}h3{animation-delay:-2.6s}.sub,.lead{animation-delay:-3.9s;--b1:var(--mute);--b2:var(--mute)}
.rot,.stat b{--b1:var(--acc-hi);--b2:var(--acc-lo);animation-delay:-.7s}
.rot{filter:drop-shadow(0 0 22px rgba(var(--acc-rgb),.36))}
.cta h2,.row:hover h3{--b1:var(--k);--b2:var(--line);--hl:rgba(255,255,255,.85)}

/* Detalle bajo el inicio */
.sep{display:flex;justify-content:center;position:relative;z-index:1}
.sep+.stats{padding-top:56px}
.cue{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--mute);font-size:13px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;font-weight:600;transition:color .2s}
.cue:hover{color:var(--acc)}
.cue i{position:relative;width:2px;height:68px;background:var(--line);border-radius:2px;overflow:hidden}
.cue i::after{content:"";position:absolute;left:0;top:-40%;width:100%;height:40%;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:drop 1.8s ease-in infinite}
@keyframes drop{to{top:100%}}
.ln{width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--line) 20%,var(--line) 80%,transparent);position:relative;overflow:hidden}
.ln::after{content:"";position:absolute;top:0;left:-25%;width:25%;height:100%;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:slide 3.2s ease-in-out infinite}
@keyframes slide{to{left:100%}}
.dots{display:flex;gap:14px;padding:6px 0}
.dots b{width:10px;height:10px;border-radius:50%;background:var(--acc);animation:wave 1.4s ease-in-out infinite}
.dots b:nth-child(2){animation-delay:.15s}.dots b:nth-child(3){animation-delay:.3s}.dots b:nth-child(4){animation-delay:.45s}.dots b:nth-child(5){animation-delay:.6s}
@keyframes wave{0%,100%{transform:scale(.5);opacity:.35}50%{transform:scale(1);opacity:1;box-shadow:0 0 16px var(--acc)}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;padding-top:80px}
.stat{border-top:1px solid var(--line);padding-top:16px}
.stat b{display:block;font-size:clamp(48px,6.4vw,84px);line-height:1;color:var(--acc)}
.stat span{color:var(--mute)}

section{padding-top:110px}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:14px;font-weight:600}
h2{font-size:clamp(36px,5.6vw,72px)}
.lead{color:var(--mute);margin-top:14px;max-width:52ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:30px 0 34px}
.filters button{font:600 15px var(--f);letter-spacing:var(--tr);padding:8px 18px;border-radius:99px;border:1px solid var(--line);background:var(--sf);color:var(--fg);cursor:pointer;transition:.2s}
.filters button:hover{border-color:var(--acc)}
.filters button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--k)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px;align-items:start;margin-top:34px}
.filters+.grid{margin-top:0}
.card{all:unset;box-sizing:border-box;display:block;cursor:pointer;color:var(--fg);letter-spacing:var(--tr)}
.card[hidden]{display:none}
.card.off{cursor:default}
.thumb{position:relative;display:block;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--sf);transition:transform .18s ease-out,box-shadow .3s,border-color .3s}
.card.v .thumb{aspect-ratio:9/16}.card.h .thumb{aspect-ratio:16/9}
.card:not(.off):hover .thumb,.card:focus-visible .thumb{transform:perspective(900px) translateY(-8px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.02);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 24px 50px rgba(var(--acc-rgb),.18)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pl{position:absolute;inset:0;display:flex;align-items:flex-end;padding:16px;font-weight:700;font-size:25px;line-height:1.02;color:var(--k)}
.play{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:var(--acc);transform:scale(.5);opacity:0;transition:.25s;box-shadow:0 0 40px rgba(var(--acc-rgb),.48)}
.play::after{content:"";position:absolute;left:26px;top:19px;border-left:19px solid var(--k);border-top:14px solid transparent;border-bottom:14px solid transparent}
.card:not(.off):hover .play,.card:focus-visible .play{transform:scale(1);opacity:1}
@media (hover:none){.card:not(.off) .play{opacity:1;transform:scale(.75)}}
.card b{display:block;margin-top:14px;font-size:20px;line-height:1.15}
.card small{color:var(--mute);font-size:14px}

.pdf{width:100vw;margin:38px 0 0 calc(50% - 50vw);position:relative;z-index:1}
.sc{--ph:clamp(380px,74vh,700px);--pad:max(24px,calc(50vw - var(--half)));position:relative;display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:26px var(--pad) 40px;scroll-padding-inline:var(--pad);scrollbar-width:none;cursor:grab}
.sc::-webkit-scrollbar{display:none}
.sc.drag{scroll-snap-type:none;cursor:grabbing;scroll-behavior:auto;user-select:none}
.slide{flex:0 0 auto;height:var(--ph);aspect-ratio:3/4;scroll-snap-align:center;position:relative;background:var(--sf);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.slide canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .5s}
.slide.ok canvas{opacity:1}
.slide{transition:transform .12s linear;will-change:transform}
.pdfmsg{height:var(--ph);width:min(100%,640px);display:grid;place-content:center;text-align:center;gap:10px;border:2px dashed var(--line);border-radius:var(--r);padding:30px;color:var(--mute);scroll-snap-align:center}
.pdfmsg b{color:var(--fg);font-size:26px}
.ctrl{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.ctrl[hidden]{display:none}
.ctrl button{width:54px;height:54px;border-radius:50%;border:2px solid var(--fg);background:transparent;color:var(--fg);font-size:22px;cursor:pointer;transition:.2s}
.ctrl button:hover{background:var(--acc);border-color:var(--acc);color:var(--k);transform:scale(1.08)}
.ctrl span{min-width:70px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.prog{max-width:420px;height:3px;background:var(--line);margin:24px auto 0;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}

.svc{margin-top:40px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:70px 1fr 1.3fr;gap:20px;align-items:baseline;padding:32px 14px;border-bottom:1px solid var(--line);transition:background .25s,color .25s}
.row:hover{background:var(--acc);color:var(--k)}
.row i{font-style:normal;font-weight:600;font-size:15px}
.row h3{font-size:clamp(24px,3.2vw,38px)}
.row p{color:var(--mute);transition:color .25s}
.row:hover p{color:#1a1a1c}
@media (max-width:700px){.row{grid-template-columns:42px 1fr}.row p{grid-column:2}}

.cta{margin-top:110px;background:var(--acc);color:var(--k);border-radius:32px;padding:clamp(40px,7vw,90px) 24px;text-align:center}
.cta h2{font-size:clamp(44px,9vw,116px)}
mark{background:none;color:inherit;-webkit-text-fill-color:inherit;padding:0}
.cta p{color:#1a1a1c;margin:20px auto 34px;max-width:46ch}
.cta .acts{justify-content:center;margin:0}
.cta .btn{border-color:var(--k);color:var(--k)}
.cta .btn.fill{background:var(--k);color:var(--acc);border-color:var(--k);box-shadow:0 5px 0 rgba(0,0,0,.45)}
.cta .btn:hover{background:var(--k);color:var(--acc);box-shadow:0 7px 0 rgba(0,0,0,.4)}
.links{margin-top:36px;display:flex;gap:26px;justify-content:center;flex-wrap:wrap}
.links a{text-underline-offset:5px;font-weight:600}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:44px 0;color:var(--mute);font-size:14px}
footer a{text-decoration:none}

.js .rv{opacity:0;transform:translateY(28px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
.js .rv.in{opacity:1;transform:none}
.js .r3{transform:perspective(900px) rotateX(-62deg) translateY(22px);transform-origin:50% 100%}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--acc);color:var(--k);padding:12px 22px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;z-index:90;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:99;animation:cf .95s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),calc(var(--dy) + 170px)) rotate(var(--r));opacity:0}}

dialog{border:0;padding:0;background:transparent;width:min(92vw,960px);max-width:none;margin:auto;overflow:visible;color:#fff}
dialog::backdrop{background:rgba(0,0,0,.88);backdrop-filter:blur(8px)}
.box{position:relative;background:#000;border-radius:var(--r);overflow:hidden;margin:0 auto;border:1px solid var(--acc);box-shadow:0 0 60px rgba(var(--acc-rgb),.20)}
.box.h{aspect-ratio:16/9;width:100%}
.box.v{--h:min(84vh,155vw);height:var(--h);width:calc(var(--h)*9/16)}
.box iframe,.box video{position:absolute;inset:0;width:100%;height:100%;border:0}
.close{position:absolute;top:-46px;right:0;background:none;border:0;color:#fff;font:600 15px var(--f);cursor:pointer;padding:8px}

.navr{display:flex;align-items:center}
.menu{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--sf);cursor:pointer;position:relative;margin-left:10px;flex:0 0 auto}
.menu span{position:absolute;left:13px;right:13px;height:2px;background:var(--fg);border-radius:2px;transition:transform .25s,top .25s}
.menu span:first-child{top:17px}.menu span:last-child{top:25px}
nav.open .menu span:first-child{top:21px;transform:rotate(45deg)}
nav.open .menu span:last-child{top:21px;transform:rotate(-45deg)}
@supports (height:1dvh){.box.v{--h:min(84dvh,155vw)}}
@media (min-width:1400px){:root{--half:640px}.wrap{max-width:1280px}.sc{--ph:clamp(380px,74vh,780px)}}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding-top:24px}
  .ph{margin:20px auto 0;max-width:340px}
  .menu{display:block}
  nav ul{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;padding:6px 24px 18px;background:rgba(var(--bg-rgb),.97);border-bottom:1px solid var(--line)}
  nav.open ul{display:flex}
  nav ul a{display:block;padding:15px 0;font-size:22px;color:var(--fg);border-bottom:1px solid var(--line)}
  section{padding-top:84px}
}
@media (max-width:600px){
  body{font-size:16px}
  .wrap{padding:0 18px}
  nav .btn{padding:8px 16px;min-height:44px}
  .hero{gap:28px;padding-bottom:56px}
  .sub{font-size:17px}
  .hero .acts .btn,.cta .acts .btn{flex:1 1 100%;justify-content:center}
  .t1{left:0}.t2{right:0}
  .tag{font-size:12px;padding:6px 12px}
  .stats{grid-template-columns:repeat(3,1fr);gap:14px;padding-top:56px}
  .stat b{font-size:38px}.stat span{font-size:13px;display:block;line-height:1.3}
  .filters button{min-height:44px}
  .grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .card.h{grid-column:1/-1}
  .card b{font-size:16px}.card small{font-size:12px}
  .pl{font-size:19px;padding:12px}
  .play{width:52px;height:52px;margin:-26px 0 0 -26px}
  .play::after{left:20px;top:14px;border-left-width:15px;border-top-width:11px;border-bottom-width:11px}
  .sc{--ph:clamp(340px,66vh,560px);--pad:18px;gap:14px}
  .ctrl button{width:48px;height:48px}
  .row{padding:24px 6px}
  .cta{border-radius:24px;margin-top:80px}
  footer{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.js .rv{opacity:1;transform:none}#glow{display:none}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="glow"></div>

<nav><div class="wrap in">
  <a class="logo" href="#"><i></i><span id="logoTxt"></span></a>
  <ul><li><a href="#trabajo">Videos</a></li><li id="navPdf"><a href="#portafolio">Portafolio</a></li><li><a href="#servicios">Servicios</a></li><li><a href="#contacto">Contacto</a></li></ul>
  <div class="navr"><a class="btn fill" href="#contacto">Contáctame</a><button class="menu" id="menu" type="button" aria-label="Menú" aria-expanded="false"><span></span><span></span></button></div>
</div></nav>

<main>
<div class="wrap hero">
  <div>
    <span class="chip" id="chip"><b></b><span id="chipTxt"></span></span>
    <h1><span id="h1"></span><span class="rot" id="rot"></span></h1>
    <p class="sub" id="sub"></p>
    <div class="acts"><a class="btn fill" href="#trabajo" id="b1"></a><a class="btn" id="b2" target="_blank" rel="noopener"></a></div>
  </div>
  <div class="ph" id="ph"><div class="tilt" id="tilt"><div class="blob"></div></div></div>
</div>

<div class="wrap">
  <div class="sep" id="sep"></div>
  <div class="stats" id="stats"></div>

  <section id="trabajo">
    <p class="eyebrow">Videos</p>
    <h2 id="wt"></h2>
    <p class="lead" id="wl"></p>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="portafolio">
    <p class="eyebrow">Portafolio</p>
    <h2 id="pt"></h2>
    <p class="lead" id="pl"></p>
  </section>
</div>

<div class="pdf rv" id="pdfBox">
  <div class="sc" id="sc" tabindex="0" aria-label="Páginas del portafolio, desliza hacia los lados"><div class="pdfmsg"><b>Cargando portafolio…</b></div></div>
  <div class="ctrl" id="ctrl"><button type="button" id="pv" aria-label="Página anterior">←</button><span id="pc">1 / 1</span><button type="button" id="nx" aria-label="Página siguiente">→</button><a class="btn" id="dl" download>Descargar PDF</a></div>
  <div class="prog"><i id="pg"></i></div>
</div>

<div class="wrap">
  <section id="servicios">
    <p class="eyebrow">Servicios</p>
    <h2 id="st"></h2>
    <div class="svc" id="svc"></div>
  </section>

  <section id="contacto">
    <div class="cta rv">
      <h2 id="ct"></h2>
      <p id="cl"></p>

<script>
/* ==========================================================
   EDITA SOLO ESTA PARTE. Todo el sitio se arma con estos datos.
   En GitHub: abre index.html → lápiz (Edit) → cambia → Commit.

   ARCHIVOS QUE SUBES al repositorio (Add file → Upload files):

   • videos            → opción A: pega el link de YouTube/Vimeo en "url" de cada proyecto

const CONFIG = {

  titular: "Videos que",

  botonSecundario: "Escríbeme",

  proyectos: [

    { titulo: "Publicitario", tipo: "Edición · comercial · 25 s", categoria: "TikTok", url: "videos/edicion-publicitaria.mp4", formato: "vertical", color: "#B8C7FF" },

};
/* ============== Fin de la parte editable ============== */

const $ = id => document.getElementById(id), C = CONFIG;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fino = matchMedia("(hover:hover) and (pointer:fine)").matches;
document.documentElement.classList.add("js");

/* Paletas de color */
const PALETAS = {
  suave:      {bg:"#101114", sf:"#18191E", fg:"#E9E9EE", mute:"#A3A3AD", line:"#2A2B33", acc:"#FF5A5F", silver:"#A9A9B6"},
  carbon:     {bg:"#141312", sf:"#1C1B19", fg:"#EDE8E1", mute:"#A8A29A", line:"#2E2C29", acc:"#FF5648", silver:"#B3ABA0"},
  medianoche: {bg:"#0D1117", sf:"#151B23", fg:"#E6EDF3", mute:"#9AA7B4", line:"#26303B", acc:"#FF6064", silver:"#A3B0BD"},
  intenso:    {bg:"#0A0A0B", sf:"#141416", fg:"#F4F4F0", mute:"#9A9AA2", line:"#2B2B30", acc:"#FF3B3B", silver:"#A9A9B3"}
};
(function(){
  const P = PALETAS[C.paleta] || PALETAS.suave, r = document.documentElement.style;
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (h, t, k) => "#" + rgb(h).map((v, i) => Math.round(v + (rgb(t)[i] - v) * k).toString(16).padStart(2, "0")).join("");
  Object.entries(P).forEach(([k, v]) => r.setProperty("--" + k, v));
  r.setProperty("--k", P.bg);
  r.setProperty("--bg-rgb", rgb(P.bg).join(","));
  r.setProperty("--acc-rgb", rgb(P.acc).join(","));
  r.setProperty("--acc-hi", mix(P.acc, "#ffffff", .3));
  r.setProperty("--acc-lo", mix(P.acc, "#000000", .12));
  document.querySelector('meta[name="theme-color"]').content = P.bg;
})();
const el = (t, c, x) => { const e = document.createElement(t); if(c) e.className = c; if(x != null) e.textContent = x; return e; };
const marcar = (n, txt) => txt.split(/\{(.+?)\}/).forEach((t, i) => n.append(i % 2 ? el("mark", null, t) : t));

/* Textos */
document.title = C.nombre + " — Editor de video y motion graphics";
$("logoTxt").textContent = C.nombre;
if(C.disponible) $("chipTxt").textContent = C.disponible; else $("chip").remove();
$("h1").textContent = C.titular;
$("sub").textContent = C.subtitulo;
$("b1").textContent = C.botonPrincipal; $("b2").textContent = C.botonSecundario;
$("wt").textContent = C.tituloTrabajo; $("wl").textContent = C.textoTrabajo;
$("pt").textContent = C.tituloPdf; $("pl").textContent = C.textoPdf;
$("st").textContent = C.tituloServicios;
marcar($("ct"), C.tituloContacto);
$("cl").textContent = C.textoContacto;
$("copy").textContent = "Copiar " + C.email;
$("foot").textContent = "© " + new Date().getFullYear() + " " + C.nombre;

/* Frase que se escribe sola */
(function(){
  const rot = $("rot"), fr = C.frases;
  if(reduce || fr.length < 2){ rot.textContent = fr[0] || ""; return; }
  let i = 0, j = 0, del = false;
  (function t(){
    const f = fr[i]; rot.textContent = f.slice(0, j);
    if(!del && j === f.length){ del = true; return setTimeout(t, 1800); }
    if(del && j === 0){ del = false; i = (i + 1) % fr.length; }
    j += del ? -1 : 1; setTimeout(t, del ? 28 : 65);
  })();
})();

/* WhatsApp o correo */
const waOk = /^\d{8,}$/.test(C.whatsapp);
const contactoUrl = waOk ? "https://wa.me/" + C.whatsapp + "?text=" + encodeURIComponent(C.mensajeWhatsapp) : "mailto:" + C.email;
$("b2").href = contactoUrl; $("c1").href = contactoUrl;
if(waOk) $("c1").querySelector("span").textContent = "Escribir por WhatsApp"; else $("c1").remove();
$("c2").href = "mailto:" + C.email + "?subject=" + encodeURIComponent("Cotización de video");

/* Foto con inclinación 3D */
const ph = $("ph"), tilt = $("tilt"), img = new Image();
img.alt = "Foto de " + C.nombre; img.src = C.foto;
img.onerror = () => { img.remove(); const n = el("div", "none"); n.append(el("b", null, "Tu foto aquí"), el("span", null, "Sube un PNG como img/foto.png")); tilt.append(n); };
tilt.append(img);
C.etiquetas.slice(0, 3).forEach((t, i) => ph.append(el("span", "tag t" + (i + 1), t)));
if(fino && !reduce){
  ph.addEventListener("pointermove", e => {
    const r = ph.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    tilt.style.transform = "rotateY(" + x * 14 + "deg) rotateX(" + -y * 14 + "deg)";
  });
  ph.addEventListener("pointerleave", () => tilt.style.transform = "");
}

/* Detalle bajo el inicio */
(function(){
  const t = C.separador, d = $("sep");
  if(t === "linea") d.append(el("div", "ln"));
  else if(t === "puntos"){ const w = el("div", "dots"); for(let i = 0; i < 5; i++) w.append(el("b")); d.append(w); }
  else if(t === "scroll"){ const a = el("a", "cue"); a.href = "#trabajo"; a.append(el("span", null, "Descubre"), el("i")); d.append(a); }
  else d.remove();
})();

/* Estadísticas */
if(C.estadisticas.length){
  C.estadisticas.forEach(s => {
    const d = el("div", "stat rv"), b = el("b", null, "0");
    b.dataset.n = s.n; b.dataset.s = s.sufijo || "";
    d.append(b, el("span", null, s.texto)); $("stats").append(d);
  });
} else $("stats").remove();
function contar(b){
  const n = +b.dataset.n, s = b.dataset.s;
  if(reduce){ b.textContent = n + s; return; }
  const t0 = performance.now();
  (function f(now){
    const k = Math.min((now - t0) / 1400, 1);
    b.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))) + s;
    if(k < 1) requestAnimationFrame(f);
  })(t0);
}

/* Servicios */
C.servicios.forEach((s, i) => {
  const r = el("div", "row rv");
  r.append(el("i", null, String(i + 1).padStart(2, "0")), el("h3", null, s.titulo), el("p", null, s.texto));
  $("svc").append(r);
});

/* Videos */
function parseUrl(u){
  if(!u) return {kind: "none"};
  let m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);
  if(m) return {kind: "youtube", id: m[1]};
  m = u.match(/vimeo\.com\/(?:.*\/)?(\d+)/);
  if(m) return {kind: "vimeo", id: m[1]};
  if(/\.(mp4|webm|mov)(\?|$)/i.test(u)) return {kind: "file"};
  return {kind: "link"};
}
const cards = [];
C.proyectos.forEach((p, i) => {
  const info = parseUrl(p.url), v = p.formato !== "horizontal";
  const card = el("button", "card rv " + (v ? "v" : "h") + (info.kind === "none" ? " off" : ""));
  card.type = "button"; card.dataset.cat = p.categoria || "";
  card.style.transitionDelay = (i % 4) * 70 + "ms";
  const th = el("span", "thumb");
  const src = p.miniatura || (info.kind === "youtube" ? "https://img.youtube.com/vi/" + info.id + "/hqdefault.jpg" : "");
  if(src){ const im = new Image(); im.src = src; im.alt = ""; im.loading = "lazy"; th.append(im); }
  else { const x = el("span", "pl", p.titulo); x.style.background = p.color || "#FF5A5F"; th.append(x); }
  if(info.kind !== "none") th.append(el("span", "play"));
  card.append(th, el("b", null, p.titulo), el("small", null, p.tipo || ""));
  card.addEventListener("click", () => openVideo(p, info, v));
  if(fino && !reduce && info.kind !== "none"){
    card.addEventListener("pointermove", e => {
      const r = th.getBoundingClientRect();
      th.style.setProperty("--rx", -((e.clientY - r.top) / r.height - .5) * 12 + "deg");
      th.style.setProperty("--ry", ((e.clientX - r.left) / r.width - .5) * 12 + "deg");
    });
    card.addEventListener("pointerleave", () => { th.style.setProperty("--rx", "0deg"); th.style.setProperty("--ry", "0deg"); });
  }
  $("grid").append(card); cards.push(card);
});
const cats = ["Todos", ...new Set(C.proyectos.map(p => p.categoria).filter(Boolean))];
if(cats.length > 2){
  cats.forEach((c, i) => {
    const b = el("button", null, c); b.type = "button"; b.setAttribute("aria-pressed", i === 0);
    b.addEventListener("click", () => {
      [...$("filters").children].forEach(x => x.setAttribute("aria-pressed", x === b));
      cards.forEach(k => k.hidden = c !== "Todos" && k.dataset.cat !== c);
    });
    $("filters").append(b);
  });
} else $("filters").remove();

C.redes.forEach(r => { const a = el("a", null, r.nombre); a.href = r.url; a.target = "_blank"; a.rel = "noopener"; $("links").append(a); });

/* Ventana de video */
const dlg = $("dlg"), box = $("box");
function openVideo(p, info, v){
  if(info.kind === "none") return;
  if(info.kind === "link"){ window.open(p.url, "_blank", "noopener"); return; }
  box.className = "box " + (v ? "v" : "h"); box.replaceChildren();
  let e;
  if(info.kind === "file"){ e = document.createElement("video"); e.src = p.url; e.controls = true; e.autoplay = true; e.playsInline = true; }
  else {
    e = document.createElement("iframe");
    e.src = info.kind === "youtube" ? "https://www.youtube.com/embed/" + info.id + "?autoplay=1&rel=0" : "https://player.vimeo.com/video/" + info.id + "?autoplay=1";
    e.allow = "autoplay; fullscreen; picture-in-picture"; e.allowFullscreen = true; e.title = p.titulo;
  }
  box.append(e); dlg.showModal();
}
$("closeBtn").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if(e.target === dlg) dlg.close(); });

/* Portafolio PDF deslizable */
const CDN = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function pdfMsg(t){
  const sc = $("sc"); sc.replaceChildren();
  const d = el("div", "pdfmsg"); d.append(el("b", null, "Tu portafolio aparece aquí"), el("span", null, t)); sc.append(d);
  $("ctrl").hidden = true;
}
function cargarPdf(){
  const sc = $("sc"), pc = $("pc"), pg = $("pg");
  $("dl").href = C.pdf;
  const s = document.createElement("script"); s.src = CDN + "pdf.min.js";
  s.onerror = () => pdfMsg("No se pudo cargar el visor. Revisa tu conexión.");
  s.onload = async () => {
    try {
      pdfjsLib.GlobalWorkerOptions.workerSrc = CDN + "pdf.worker.min.js";
      const doc = await pdfjsLib.getDocument(C.pdf).promise, n = doc.numPages;
      const v1 = (await doc.getPage(1)).getViewport({scale: 1});
      sc.replaceChildren();
      const sl = [];
      for(let i = 1; i <= n; i++){ const d = el("div", "slide"); d.style.aspectRatio = v1.width + " / " + v1.height; d.dataset.i = i; sc.append(d); sl.push(d); }
      const draw = async (i, d) => {
        const p = await doc.getPage(i), v = p.getViewport({scale: 1});
        d.style.aspectRatio = v.width + " / " + v.height;
        const vp = p.getViewport({scale: Math.min(devicePixelRatio || 1, 2) * d.clientHeight / v.height});
        const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height; d.append(c);
        await p.render({canvasContext: c.getContext("2d"), viewport: vp}).promise; d.classList.add("ok");
      };
      const io2 = new IntersectionObserver(es => es.forEach(e => {
        if(e.isIntersecting && !e.target.dataset.r){ e.target.dataset.r = 1; draw(+e.target.dataset.i, e.target); }
      }), {root: sc, rootMargin: "0px 120% 0px 120%"});
      sl.forEach(d => io2.observe(d));
      const upd = () => {
        const mid = sc.scrollLeft + sc.clientWidth / 2; let b = 0, bd = 1e9;
        sl.forEach((d, i) => { const k = Math.abs(d.offsetLeft + d.offsetWidth / 2 - mid); if(k < bd){ bd = k; b = i; } });
        pc.textContent = (b + 1) + " / " + n; pg.style.width = ((b + 1) / n * 100) + "%";
        if(!reduce) sl.forEach(d => { const a = Math.max(-2, Math.min(2, (d.offsetLeft + d.offsetWidth / 2 - mid) / (d.offsetWidth + 20))); d.style.transform = "perspective(1100px) rotateY(" + (-a * 16) + "deg) scale(" + (1 - Math.min(Math.abs(a), 1.5) * .07) + ")"; });
      };
      sc.addEventListener("scroll", upd, {passive: true}); upd();
      const paso = () => sl[0].offsetWidth + 20;
      $("pv").onclick = () => sc.scrollBy({left: -paso(), behavior: "smooth"});
      $("nx").onclick = () => sc.scrollBy({left: paso(), behavior: "smooth"});
      let x0, s0, on = false;
      sc.addEventListener("pointerdown", e => { if(e.pointerType !== "mouse") return; on = true; x0 = e.clientX; s0 = sc.scrollLeft; sc.classList.add("drag"); });
      addEventListener("pointermove", e => { if(on) sc.scrollLeft = s0 - (e.clientX - x0); });
      addEventListener("pointerup", () => { if(on){ on = false; sc.classList.remove("drag"); } });
    } catch(_) {
      pdfMsg("Sube tu PDF al repositorio con el nombre " + C.pdf + ". (Solo se ve cuando la página está en GitHub, no abriendo el archivo en tu computadora.)");
    }
  };
  document.head.append(s);
}
if(C.pdf){
  const o = new IntersectionObserver(es => { if(es[0].isIntersecting){ o.disconnect(); cargarPdf(); } }, {rootMargin: "700px"});
  o.observe($("portafolio"));
} else { $("portafolio").remove(); $("pdfBox").remove(); $("navPdf").remove(); }

/* Copiar correo, confeti y botones magnéticos */
function toast(t){ const n = $("toast"); n.textContent = t; n.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => n.classList.remove("show"), 1900); }
function confeti(x, y){
  if(reduce) return;
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  const cols = [v("--acc"), v("--fg"), v("--bg"), v("--acc-hi")];
  for(let i = 0; i < 30; i++){
    const d = el("i", "cf"), a = Math.random() * 6.283, s = 90 + Math.random() * 170;
    d.style.cssText = "left:" + x + "px;top:" + y + "px;background:" + cols[i % 4] + ";--dx:" + Math.cos(a) * s + "px;--dy:" + (Math.sin(a) * s - 70) + "px;--r:" + Math.random() * 720 + "deg";
    document.body.append(d); setTimeout(() => d.remove(), 1000);
  }
}
document.querySelectorAll(".btn").forEach(b => {
  b.addEventListener("click", e => { const r = b.getBoundingClientRect(); confeti(e.clientX || r.left + r.width / 2, e.clientY || r.top + r.height / 2); });
});
$("copy").addEventListener("click", async () => { try { await navigator.clipboard.writeText(C.email); } catch(_) {} toast("¡Correo copiado!"); });

/* Resplandor que sigue al cursor */
if(fino && !reduce){
  const g = $("glow"); let tx = innerWidth / 2, ty = 200, x = tx, y = ty;
  addEventListener("pointermove", e => { tx = e.clientX; ty = e.clientY; });
  (function f(){ x += (tx - x) * .12; y += (ty - y) * .12; g.style.transform = "translate(" + x + "px," + y + "px)"; requestAnimationFrame(f); })();
}

/* Títulos que se "levantan" al aparecer */
document.querySelectorAll("section>h2").forEach(h => h.classList.add("rv", "r3"));

/* Menú móvil */
const nav = document.querySelector("nav"), mb = $("menu");
const cerrar = () => { nav.classList.remove("open"); mb.setAttribute("aria-expanded", "false"); };
mb.addEventListener("click", () => { const o = nav.classList.toggle("open"); mb.setAttribute("aria-expanded", o); });
nav.querySelectorAll("ul a").forEach(a => a.addEventListener("click", cerrar));
addEventListener("keydown", e => { if(e.key === "Escape") cerrar(); });
addEventListener("resize", () => { if(innerWidth > 860) cerrar(); });

/* Aparición al hacer scroll + barra de progreso */
const io = new IntersectionObserver(es => es.forEach(e => {
  if(!e.isIntersecting) return;
  e.target.classList.add("in");
  const b = e.target.querySelector("b[data-n]") || (e.target.dataset.n ? e.target : null); if(b) contar(b);
  io.unobserve(e.target);
}), {threshold: .15});
document.querySelectorAll(".rv").forEach(n => io.observe(n));
const bar = $("bar");
addEventListener("scroll", () => {
  const h = document.documentElement;
  bar.style.transform = "scaleX(" + (h.scrollTop / (h.scrollHeight - h.clientHeight || 1)) + ")";
}, {passive: true});
</script>
</body>
</html>
